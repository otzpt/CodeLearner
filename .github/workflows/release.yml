name: Release

# Builds the launcher and bundles it with every course for Windows and Linux,
# and packages Linux three more ways (.deb, Arch, AppImage). Triggered by a
# version tag (v1.0.0) or manually. Tags with a suffix (v1.0.0-ci1) build
# without publishing, so the workflow can be exercised safely.
#
# Every course runs on the shared lesson engine in learn/ with Node, and runs
# its examples with that language's own toolchain on the student's machine,
# so the bundle is the launcher, learn/ and each course's lesson files.
#
# Artifacts are UNSIGNED; the OS may warn about an unknown publisher.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# The build job runs third-party code and writes nothing to the repository.
# Only the release job below gets write access.
permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
          - os: ubuntu-22.04
            name: linux-x86_64
    env:
      # Every course in the bundle, in launcher order.
      COURSES: c cpp assembly rust arduino micropython python javascript java csharp html css webjs security gtk raylib git
      # The ones the Windows leg checks: the rest are Linux-only, or slow to
      # build there without adding coverage the Linux leg lacks.
      WINDOWS_COURSES: c cpp micropython python javascript html css webjs
    steps:
      - uses: actions/checkout@v7

      - name: Install MinGW (Windows)
        if: runner.os == 'Windows'
        run: choco install mingw make -y
        shell: bash

      # Node runs every course. The rest are the toolchains the courses run
      # their examples with; the checks below need all of them.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # dotnet run file.cs, which the C# course uses, needs .NET 10.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install course toolchains (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # nasm for Assembly, gtk4 for GTK (this runner's GTK is older than
          # the course needs, so its check reports it skipped), and the AVR
          # tools for arduino/avr's checks. raylib has no Ubuntu package; its
          # course is skipped the same way.
          sudo apt-get install -y -qq nasm libgtk-4-dev gcc-avr avr-libc simavr

      - name: Build the launcher and the Libraries reference
        shell: bash
        run: |
          set -euo pipefail
          # The launcher shows this version and compares it with the latest
          # release in "Check for updates". A tag v1.5.1 builds as 1.5.1 (and
          # v1.5.1-ci1 as 1.5.1-ci1); anything else is a development build.
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;;
            *)            version=dev ;;
          esac
          make -C launcher CC=gcc VERSION="$version"
          make -C launcher CC=gcc VERSION="$version" check
          if [ "${{ runner.os }}" = "Linux" ]; then
            make -C libraries
          fi

      # Every example runs (or fails where it is meant to), every quiz answer
      # exists, every exercise's solution passes the checker; then every
      # lesson is played from start to finish.
      - name: Check every course (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          for course in $COURSES; do
            node learn/check.js "$course"
            python3 learn/check-course.py "$course"
          done
          # The Libraries reference: every page builds and runs, and the
          # browser opens them all.
          python3 libraries/check-pages.py
          python3 libraries/check-browser.py
          # The AVR code in arduino/avr: compiled, and run on a simulated
          # ATmega328P.
          python3 arduino/avr/check-avr.py
          python3 arduino/avr/run-avr.py

      - name: Check the courses that run on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          for course in $WINDOWS_COURSES; do
            node learn/check.js "$course"
          done

      # CODELEARNER_LANG=pt-pt: menus, prompts and summaries in Portuguese.
      # k answers every prompt (k skips an exercise), so lesson 1 reaches
      # its summary.
      - name: Check the Portuguese mode (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for course in $COURSES; do
            out=$({ printf '1\n'; printf 'k\n%.0s' $(seq 150); } | CODELEARNER_LANG=pt-pt CODELEARNER_PRACTICE_DIR="$RUNNER_TEMP/pt-$course" timeout 300 node "$course/learn.js")
            grep -q "Sair" <<<"$out" || { echo "::error::$course has no Portuguese menu"; exit 1; }
            grep -q "RESUMO" <<<"$out" || { echo "::error::$course has no Portuguese summary"; exit 1; }
          done
          out=$(printf '0\n' | CODELEARNER_LANG=pt-pt timeout 20 libraries/libraries)
          grep -q "BIBLIOTECAS" <<<"$out" || { echo "::error::Libraries has no Portuguese menu"; exit 1; }
          out=$(cd launcher && printf 'l\n0\n' | timeout 20 ./launcher)
          grep -q "BAIXO NIVEL" <<<"$out" || { echo "::error::the launcher did not switch to Portuguese"; exit 1; }

      - name: Smoke-test the launcher (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cd launcher
          # Every entry: pick it, quit the course, quit the launcher. Proves
          # the launcher can start each course and get back, not just start.
          number=0
          for title in "C FROM ZERO" "C++ FROM ZERO" "ASSEMBLY FROM ZERO" "RUST FROM ZERO" "ARDUINO FROM ZERO" "MICROPYTHON FROM ZERO" "PYTHON FROM ZERO" "JAVASCRIPT FROM ZERO" "JAVA FROM ZERO" "C# FROM ZERO" "HTML FROM ZERO" "CSS FROM ZERO" "WEB JAVASCRIPT FROM ZERO" "SECURITY FROM ZERO" "GTK FROM ZERO" "RAYLIB FROM ZERO" "GIT FROM ZERO"; do
            number=$((number + 1))
            out=$(printf '%s\nq\n0\n' "$number" | CODELEARNER_PRACTICE_DIR="$RUNNER_TEMP/smoke" timeout 30 ./launcher)
            grep -q "$title" <<<"$out" || { echo "::error::launcher entry $number did not reach $title"; exit 1; }
            grep -q "See you next time" <<<"$out" || { echo "::error::launcher did not exit cleanly after $title"; exit 1; }
          done
          out=$(printf '18\n0\n0\n' | timeout 20 ./launcher)
          grep -q "LIBRARIES - A REFERENCE" <<<"$out" || { echo "::error::launcher did not reach the Libraries reference"; exit 1; }

          # [u] Check for updates is reachable and returns to the menu. What it
          # prints depends on the network and on GitHub's rate limit for shared
          # runners, so any of its known outcomes passes; a crash or a hang
          # does not. (The version comparison itself is covered by make check.)
          out=$(printf 'u\n\n0\n' | timeout 30 ./launcher)
          grep -q "Check for updates" <<<"$out" || { echo "::error::launcher menu has no Check for updates"; exit 1; }
          grep -qE "A newer release is available|You are up to date|newer than the latest release|development build|Could not check for updates" <<<"$out" || { echo "::error::Check for updates printed no known outcome"; echo "$out"; exit 1; }

      - name: Smoke-test the launcher (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd launcher
          # PowerShell splits a native command's stdout into one array element
          # per line, and -match against an array returns members, not a bool;
          # joining to one string first makes these real boolean checks.
          $out = ("7`nq`n0`n" | & .\launcher.exe) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "launcher exited $LASTEXITCODE" }
          if ($out -notmatch "PYTHON FROM ZERO") { throw "launcher did not reach the Python course: $out" }
          if ($out -notmatch "See you next time") { throw "launcher did not exit cleanly: $out" }
          $out = ("u`n`n0`n" | & .\launcher.exe) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "launcher exited $LASTEXITCODE after Check for updates" }
          if ($out -notmatch "A newer release is available|You are up to date|newer than the latest release|development build|Could not check for updates") { throw "Check for updates printed no known outcome: $out" }

      - name: Assemble the bundle
        shell: bash
        run: |
          set -euo pipefail
          out=codelearner-${{ matrix.name }}
          mkdir -p "$out/launcher" "$out/learn"
          cp learn/*.js learn/*.py "$out/learn/"
          for course in $COURSES; do
            mkdir -p "$out/$course"
            cp "$course/learn.js" "$course/course.js" "$out/$course/"
            cp -r "$course/lessons" "$out/$course/"
          done
          # Files a course needs beyond its lessons: the Arduino core stand-in
          # and the MicroPython board stand-in.
          cp -r arduino/shim "$out/arduino/"
          cp micropython/sim.py "$out/micropython/"

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp launcher/launcher.exe "$out/launcher/"
            printf '@echo off\r\ncd /d "%%~dp0launcher"\r\nlauncher.exe\r\n' > "$out/codelearner.bat"
          else
            cp launcher/launcher "$out/launcher/"
            # Libraries: the browser, and the pages it compiles and runs on
            # demand (it finds them next to itself). Linux only.
            mkdir -p "$out/libraries/c" "$out/libraries/python"
            cp libraries/libraries "$out/libraries/"
            cp libraries/c/* "$out/libraries/c/"
            cp libraries/python/* "$out/libraries/python/"
            # The application menu entry and its icon, for install.sh to place
            # (the .deb, the Arch package and the AppImage install them
            # themselves).
            mkdir -p "$out/desktop"
            cp assets/com.otzpt.codelearner.desktop "$out/desktop/"
            cp assets/icon.png "$out/desktop/com.otzpt.codelearner.png"
            printf '#!/bin/sh\ncd "$(dirname "$0")/launcher" && exec ./launcher\n' > "$out/codelearner.sh"
            chmod +x "$out/codelearner.sh" "$out/launcher/launcher" "$out/libraries/libraries"
            chmod +x "$out"/*/learn.js
          fi
          cp README.md LICENSE "$out/"

          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$out.zip" "$out" > /dev/null
          else
            tar -czf "$out.tar.gz" "$out"
            # install.sh checks the tarball against this.
            sha256sum "$out.tar.gz" > "$out.tar.gz.sha256"
            zip -qr "$out.zip" "$out"
          fi

      # The bundle on its own, outside the source tree: a course must run
      # from what was packed, with nothing else beside it.
      - name: Smoke-test the bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bundle"
          tar -xzf codelearner-linux-x86_64.tar.gz -C "$RUNNER_TEMP/bundle"
          cd "$RUNNER_TEMP/bundle/codelearner-linux-x86_64/launcher"
          out=$(printf '5\n1\n\n\n\nm\nq\n0\n' | CODELEARNER_PRACTICE_DIR="$RUNNER_TEMP/bundle-practice" timeout 60 ./launcher)
          grep -q "ARDUINO FROM ZERO" <<<"$out" || { echo "::error::the bundled Arduino course did not start"; exit 1; }
          grep -q "Output:" <<<"$out" || { echo "::error::the bundled Arduino course ran no example"; echo "$out" | tail -20; exit 1; }

      - name: Check the desktop entry (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          command -v desktop-file-validate >/dev/null || sudo apt-get install -y desktop-file-utils
          desktop-file-validate assets/com.otzpt.codelearner.desktop

      - name: Package Linux (.deb)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # A tag v1.5.1 packages as 1.5.1; a manual run on a branch has no
          # version, and dpkg and makepkg need one that starts with a digit.
          case "$GITHUB_REF" in
            refs/tags/v*) pkgver="${GITHUB_REF_NAME#v}" ;;
            *)            pkgver="0.0.0-dev" ;;
          esac
          pkg=deb/codelearner
          # /opt, not /usr/bin, because the launcher finds every course by a
          # path relative to its own directory (../c, ../python, ...). The
          # wrapper is the only thing that goes on PATH.
          mkdir -p "$pkg/DEBIAN" "$pkg/usr/bin" "$pkg/opt/codelearner"
          cp -r codelearner-linux-x86_64/* "$pkg/opt/codelearner/"
          rm -f "$pkg/opt/codelearner/codelearner.sh"
          rm -rf "$pkg/opt/codelearner/desktop"
          install -Dm644 assets/com.otzpt.codelearner.desktop "$pkg/usr/share/applications/com.otzpt.codelearner.desktop"
          install -Dm644 assets/icon.png "$pkg/usr/share/icons/hicolor/512x512/apps/com.otzpt.codelearner.png"
          cat > "$pkg/usr/bin/codelearner" <<'EOF'
          #!/bin/sh
          cd /opt/codelearner/launcher && exec ./launcher
          EOF
          chmod +x "$pkg/usr/bin/codelearner" "$pkg/opt/codelearner/launcher/launcher" "$pkg/opt/codelearner/libraries/libraries"
          cat > "$pkg/DEBIAN/control" <<EOF
          Package: codelearner
          Version: $pkgver
          Architecture: amd64
          Maintainer: CodeLearner <noreply@invalid>
          Depends: nodejs
          Suggests: gcc, g++, python3, default-jdk, rustc, nasm, git, libgtk-4-dev
          Description: Programming courses for the terminal, from zero
           Every course runs on Node. Each one runs its examples and checks
           your exercises with that language's own toolchain, so install the
           ones for the courses you take (see Suggests); C#, which needs the
           .NET 10 SDK, and raylib are not packaged by Debian.
          EOF
          dpkg-deb --build --root-owner-group "$pkg" "codelearner-amd64.deb"
          # The package must actually carry the menu entry and its icon.
          listing="$(dpkg-deb -c codelearner-amd64.deb)"
          echo "$listing" | grep -q ' ./usr/share/applications/com.otzpt.codelearner.desktop$' || { echo "::error::the .deb has no desktop entry"; exit 1; }
          echo "$listing" | grep -q ' ./usr/share/icons/hicolor/512x512/apps/com.otzpt.codelearner.png$' || { echo "::error::the .deb has no icon"; exit 1; }

      - name: Package Linux (Arch .pkg.tar.zst)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) pkgver="${GITHUB_REF_NAME#v}" ;;
            *)            pkgver="0.0.0.dev" ;;
          esac
          # makepkg's pkgver forbids colons, slashes, hyphens and whitespace
          # (e.g. a "-ci1" verification-tag suffix) -- substitute with dots.
          pkgver="$(printf '%s' "$pkgver" | tr -c 'A-Za-z0-9._' '.')"
          mkdir -p archpkg && cd archpkg
          cp -r ../codelearner-linux-x86_64 payload
          rm -f payload/codelearner.sh
          cat > PKGBUILD <<EOF
          pkgname=codelearner
          pkgver=$pkgver
          pkgrel=1
          pkgdesc="Programming courses for the terminal, from zero"
          arch=('x86_64')
          url="https://github.com/otzpt/CodeLearner"
          license=('MIT')
          depends=('nodejs')
          optdepends=('gcc: the C, C++, GTK and raylib courses'
                      'python: the Python, MicroPython and Security courses'
                      'jdk-openjdk: the Java course'
                      'dotnet-sdk: the C# course (.NET 10 or later)'
                      'rust: the Rust course'
                      'nasm: the Assembly course'
                      'gtk4: the GTK course'
                      'raylib: the raylib course'
                      'git: the Git course')
          options=('!strip' '!debug')
          package() {
            mkdir -p "\$pkgdir/opt/codelearner"
            cp -r "\$startdir/payload/." "\$pkgdir/opt/codelearner/"
            rm -rf "\$pkgdir/opt/codelearner/desktop"
            chmod 755 "\$pkgdir/opt/codelearner/launcher/launcher" "\$pkgdir/opt/codelearner/libraries/libraries"
            install -Dm644 "\$startdir/payload/desktop/com.otzpt.codelearner.desktop" "\$pkgdir/usr/share/applications/com.otzpt.codelearner.desktop"
            install -Dm644 "\$startdir/payload/desktop/com.otzpt.codelearner.png" "\$pkgdir/usr/share/icons/hicolor/512x512/apps/com.otzpt.codelearner.png"
            mkdir -p "\$pkgdir/usr/bin"
            cat > "\$pkgdir/usr/bin/codelearner" <<'WRAPPER'
          #!/bin/sh
          cd /opt/codelearner/launcher && exec ./launcher
          WRAPPER
            chmod 755 "\$pkgdir/usr/bin/codelearner"
          }
          EOF
          docker run --rm -v "$(pwd)":/pkg -w /pkg archlinux:base-devel bash -c '
            useradd -m builder && chown -R builder /pkg &&
            sudo -u builder makepkg -f --noconfirm --nodeps'
          cp codelearner-*.pkg.tar.zst "$GITHUB_WORKSPACE/codelearner-x86_64.pkg.tar.zst"
          listing="$(zstd -dc "$GITHUB_WORKSPACE/codelearner-x86_64.pkg.tar.zst" | tar -t)"
          echo "$listing" | grep -q 'usr/share/applications/com.otzpt.codelearner.desktop$' || { echo "::error::the Arch package has no desktop entry"; exit 1; }
          echo "$listing" | grep -q 'usr/share/icons/hicolor/512x512/apps/com.otzpt.codelearner.png$' || { echo "::error::the Arch package has no icon"; exit 1; }
          echo "$listing" | grep -q 'opt/codelearner/learn/app.js$' || { echo "::error::the Arch package has no lesson engine"; exit 1; }

      - name: Package Linux (AppImage)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          appid=com.otzpt.codelearner
          APPDIR=CodeLearner.AppDir
          mkdir -p "$APPDIR/usr/share/icons/hicolor/512x512/apps"
          cp -r "codelearner-linux-x86_64" "$APPDIR/opt"
          rm -f "$APPDIR/opt/codelearner.sh"
          cp assets/icon.png "$APPDIR/$appid.png"
          cp assets/icon.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/$appid.png"
          # The same desktop entry the other packages install; see the file
          # for why it says Terminal=true.
          cp "assets/$appid.desktop" "$APPDIR/$appid.desktop"
          rm -rf "$APPDIR/opt/desktop"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          cd "$HERE/opt/launcher" && exec ./launcher
          EOF
          chmod +x "$APPDIR/AppRun" "$APPDIR/opt/launcher/launcher" "$APPDIR/opt/libraries/libraries"
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run "$APPDIR" "codelearner-x86_64.AppImage"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: codelearner-${{ matrix.name }}
          path: |
            codelearner-windows-x86_64.zip
            codelearner-linux-x86_64.tar.gz
            codelearner-linux-x86_64.tar.gz.sha256
            codelearner-linux-x86_64.zip
            codelearner-amd64.deb
            codelearner-x86_64.pkg.tar.zst
            codelearner-x86_64.AppImage
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: |
      always() && needs.build.result == 'success'
      && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            CodeLearner: programming courses for the terminal, written for
            someone who has never programmed. Every lesson runs its examples
            live, explains errors in plain words, and ends with a small
            program you write in a real file and the course checks.

            **Needs Node.js** to run the courses, plus each language's own
            toolchain for the courses you take (gcc/g++, python3, a JDK,
            the .NET 10 SDK, rustc, nasm, git, GTK 4.10+, raylib). Assembly,
            Arduino and Git are Linux-only; Arduino and MicroPython run on a
            PC with a stand-in for the board, no hardware needed. The HTML,
            CSS and Web JavaScript courses use a small built-in stand-in for a
            browser, since a terminal cannot draw a page; GTK and raylib
            build your programs and you run the windows yourself.

            The Libraries entry is a reference manual, not a course, bundled
            on Linux only (its pages read /proc and /sys).

            **Windows:** portable `.zip` -- extract, run `codelearner.bat`.
            **Linux:** `.deb`, Arch `.pkg.tar.zst`, `.AppImage`, or the
            portable `.tar.gz`/`.zip` (run `./codelearner.sh`).

            Unsigned: the OS may warn about an unknown publisher on first run.
